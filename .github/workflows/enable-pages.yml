name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking Pages status for $REPO..."

          STATUS=$(gh api repos/$REPO/pages 2>&1 || echo "NOT_FOUND")
          echo "Current status: $STATUS"

          if echo "$STATUS" | grep -q "NOT_FOUND\|404"; then
            echo "Enabling GitHub Pages for $REPO..."
            gh api repos/$REPO/pages \
              --method POST \
              -H "Accept: application/vnd.github.v3+json" \
              -f source[branch]=main \
              -f source[path]='/' \
              && echo "Pages enabled successfully!" \
              || echo "Could not enable Pages via branch source, trying GitHub Actions source..."
          else
            echo "Pages already exists: $STATUS"
          fi
