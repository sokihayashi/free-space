<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STATION MAP — 文字を都市計画にする地図ジェネレータ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F2EDE4'/><g stroke='%2316233A' stroke-width='1' fill='none'><path d='M0 8h32M0 16h32M0 24h32M8 0v32M16 0v32M24 0v32'/></g><rect x='10' y='10' width='12' height='12' fill='%23F2EDE4'/><g stroke='%2316233A' stroke-width='.5' fill='none'><path d='M10 12h12M10 14h12M10 16h12M10 18h12M10 20h12M12 10v12M14 10v12M16 10v12M18 10v12M20 10v12'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#F5F0E8;--paper2:#EDE8DB;--ink:#1a1a1a;--mid:#555;--light:#999;--bd:#D5CEC2;
        --font:'DM Mono','Courier New',monospace;--disp:'Syne',system-ui,sans-serif}
  body{font-family:var(--font);background:var(--paper);color:var(--ink);padding:16px 24px 40px}
  body.drag{outline:3px dashed var(--ink);outline-offset:-12px}
  header{display:flex;align-items:baseline;gap:18px;margin-bottom:14px;padding-bottom:12px;
         border-bottom:2px solid var(--ink);flex-wrap:wrap}
  .logo{font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:-.5px}
  .tag{font-size:10px;color:var(--light);letter-spacing:.14em;text-transform:uppercase}
  .home{margin-left:auto;font-size:10px}.home a{color:var(--mid)}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  #canvas-holder{border:1px solid var(--bd);background:var(--paper2);line-height:0}
  #canvas-holder canvas{width:100%!important;height:auto!important;display:block}
  .panel{display:flex;flex-direction:column;gap:13px}
  .card{border:1px solid var(--bd);background:#fff;padding:13px 14px}
  .card h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--light);
           font-weight:500;margin-bottom:10px}
  label.row{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin:8px 0 3px}
  label.row .v{color:var(--light);font-size:10px}
  input[type=range]{width:100%;accent-color:var(--ink)}
  input[type=range]:disabled{opacity:.35}
  input[type=text],input[type=number],select{width:100%;font-family:var(--font);font-size:12px;
    padding:7px 8px;border:1px solid var(--bd);background:var(--paper);color:var(--ink)}
  .btn{font-family:var(--font);font-size:11px;letter-spacing:.08em;padding:9px 12px;border:1px solid var(--ink);
       background:var(--ink);color:var(--paper);cursor:pointer;text-transform:uppercase}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:default}
  .btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:11px;margin-top:10px}
  .checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .hint{font-size:10px;color:var(--light);line-height:1.6;margin-top:9px}
  #srcname{font-size:10px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file{display:flex;gap:8px;align-items:center}
  .file input{display:none}
  .meter{display:flex;gap:12px;align-items:center}
  #thumb{width:112px;height:112px;border:1px solid var(--bd);flex-shrink:0;background:#fff}
  .readout{font-size:10px;line-height:1.6}
  .readout.ok{color:#1a7a4a}.readout.warn{color:#a06a10}.readout.bad{color:#b0342c}
  #stats{font-size:10px;color:var(--light);margin-top:8px}
  .seedrow{display:flex;gap:8px}.seedrow input{flex:1}
</style>
</head>
<body>

<header>
  <div class="logo">STATION MAP</div>
  <div class="tag">Letterform as urban plan · p5.js</div>
  <div class="home"><a href="../">← RISO PRESS</a></div>
</header>

<div class="wrap">
  <div id="canvas-holder"></div>

  <div class="panel">

    <div class="card">
      <h2>1 — 素材（画像 / SVG）</h2>
      <div class="file">
        <label class="btn ghost" for="file">ファイルを選ぶ</label>
        <input type="file" id="file" accept="image/*,.svg">
        <div id="srcname">サンプル表示中</div>
      </div>
      <label class="row">文字サイズ <span class="v" id="scale-val">1</span></label>
      <input type="range" id="scale" min="0.45" max="1.9" step="0.02" value="1">
      <label class="row">上下位置 <span class="v" id="offsety-val">0</span></label>
      <input type="range" id="offsety" min="-0.25" max="0.25" step="0.01" value="0">
      <label class="row">2値化しきい値 <span class="v" id="threshold-val">0.55</span></label>
      <input type="range" id="threshold" min="0.15" max="0.9" step="0.01" value="0.55" disabled>
      <div class="checks"><label><input type="checkbox" id="srcinvert"> 白黒反転</label></div>
      <div class="hint">ドラッグ&amp;ドロップ / ⌘V も可。透過 PNG・SVG はアルファをそのまま使います。</div>
    </div>

    <div class="card">
      <h2>2 — 文字の見せ方</h2>
      <select id="channel">
        <option value="grain">粒度 — 文字の中だけ街区が細かい（色を使わない）</option>
        <option value="water">水面 — 文字が湾・水域になる</option>
        <option value="green">緑地 — 文字が公園の塊になる</option>
      </select>
      <label class="row">街区の細かさ（文字の内側） <span class="v" id="grainin-val">0.25</span></label>
      <input type="range" id="grainin" min="0.10" max="0.8" step="0.01" value="0.25">
      <label class="row">外側との粒度比 <span class="v" id="grainratio-val">2.8</span></label>
      <input type="range" id="grainratio" min="1.2" max="6" step="0.1" value="2.8">
      <label class="row">文字の内側の建蔽率 <span class="v" id="builtin-val">0.86</span></label>
      <input type="range" id="builtin" min="0.55" max="1" step="0.01" value="0.86">
      <div class="hint">粒度比と建蔽率が明度差を作ります。ΔL が足りないときはこの 2 つを動かします。
      粒度比を 1 未満にすると、文字の内側が「大街区」になり暗く出ます。</div>
    </div>

    <div class="card">
      <h2>3 — 都市</h2>
      <div class="seedrow">
        <input type="number" id="seed" value="7">
        <button class="btn" id="dice">SEED 🎲</button>
      </div>
      <label class="row">幹線の本数 <span class="v" id="arterials-val">5</span></label>
      <input type="range" id="arterials" min="1" max="14" step="1" value="5">
      <label class="row">緑地の数 <span class="v" id="parks-val">6</span></label>
      <input type="range" id="parks" min="0" max="16" step="1" value="6">
      <label class="row">道路の太さ <span class="v" id="roadw-val">1</span></label>
      <input type="range" id="roadw" min="0.5" max="2" step="0.05" value="1">
      <select id="palette" style="margin-top:10px">
        <option value="paper">PAPER — 生成り × 紺</option>
        <option value="mono">MONO — 白黒</option>
        <option value="night">NIGHT — 反転</option>
        <option value="riso">RISO — リソ青</option>
      </select>
      <div class="checks">
        <label><input type="checkbox" id="bay" checked> 湾をつくる</label>
        <label><input type="checkbox" id="boundaryroad" checked> 境界に道路を敷く</label>
        <label><input type="checkbox" id="grain" checked> 紙の粒子</label>
      </div>
      <div id="stats"></div>
    </div>

    <div class="card">
      <h2>4 — 可読性と書き出し</h2>
      <input type="text" id="caption" value="TOKYO CONTENTS STATION">
      <div class="meter" style="margin-top:12px">
        <canvas id="thumb" width="112" height="112"></canvas>
        <div>
          <div class="hint" style="margin:0 0 6px">アプリ上の実サイズ（112px）</div>
          <div class="readout" id="dl"></div>
        </div>
      </div>
      <div class="btns">
        <button class="btn" id="save1400">PNG 1400</button>
        <button class="btn" id="save3000">PNG 3000</button>
      </div>
    </div>

  </div>
</div>

<script src="vendor/p5.min.js"></script>
<script src="src/field.js"></script>
<script src="src/network.js"></script>
<script src="src/blocks.js"></script>
<script src="src/render.js"></script>
<script src="src/legibility.js"></script>
<script src="src/ui.js"></script>
<script src="sketch.js"></script>
</body>
</html>
