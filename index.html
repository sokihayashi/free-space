<html lang="en">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07070e;
  --surface:#10101a;
  --surface2:#181826;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --text:#eeeeff;
  --muted:#7878a8;
  --accent:#6366f1;
  --accent2:#a855f7;
  --glow:rgba(99,102,241,0.22);
  --r:14px;
}

html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  display:grid;
  grid-template-rows:auto 1fr auto;
  overflow:hidden;
}

/* ── Header ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.875rem 1.5rem;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  gap:1rem;
}
.logo{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.logo-gem{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,#00ff9f 0%,#00b3ff 40%,#9500ff 100%);
  box-shadow:0 4px 16px rgba(0,180,255,.35);
}
.logo-name{
  font-size:1rem;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#818cf8,#c084fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.badge{
  font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:#10b981;background:rgba(16,185,129,.12);
  border:1px solid rgba(16,185,129,.25);
  padding:.12rem .45rem;border-radius:100px;
}
.hdr-right{display:flex;align-items:center;gap:.75rem}
.x-btn{
  display:flex;align-items:center;gap:.4rem;
  padding:.42rem .85rem;
  background:#000;color:#fff;
  border:1px solid rgba(255,255,255,.18);
  border-radius:100px;font-size:.78rem;font-weight:600;
  cursor:pointer;text-decoration:none;
  transition:all .2s;white-space:nowrap;
}
.x-btn:hover{background:#111;border-color:rgba(255,255,255,.35)}

/* ── Layout ── */
main{display:flex;overflow:hidden;min-height:0}

/* ── Canvas area ── */
.canvas-area{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  padding:1.125rem;gap:.75rem;
}
.canvas-wrap{
  position:relative;flex:1;min-height:0;
  border-radius:18px;overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 32px 80px rgba(0,0,0,.65);
  cursor:crosshair;
}
#gc{width:100%;height:100%;display:block}
#grc{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;mix-blend-mode:overlay;opacity:0;
}
.blob-handle{
  position:absolute;
  width:22px;height:22px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.92);
  box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.45);
  cursor:grab;transform:translate(-50%,-50%);
  transition:transform .14s,box-shadow .14s;z-index:10;
}
.blob-handle:hover{
  transform:translate(-50%,-50%) scale(1.28);
  box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.55);
}
.blob-handle.dragging{cursor:grabbing;transform:translate(-50%,-50%) scale(1.12)}
.canvas-hint{
  font-size:.72rem;color:var(--muted);text-align:center;flex-shrink:0;
}

/* ── Panel ── */
.panel{
  width:296px;flex-shrink:0;
  border-left:1px solid var(--border);
  overflow-y:auto;padding:1rem;
  display:flex;flex-direction:column;gap:.875rem;
}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:.9rem;
}
.card-title{
  font-size:.67rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.8rem;
}

/* Presets */
.presets-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
.preset-btn{
  aspect-ratio:1;border-radius:9px;
  border:2px solid transparent;cursor:pointer;
  transition:all .18s;position:relative;overflow:hidden;
}
.preset-btn:hover{transform:scale(1.07);border-color:rgba(255,255,255,.4)}
.preset-btn.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.preset-lbl{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  font-size:.52rem;font-weight:700;color:#fff;text-align:center;
  padding:.18rem;opacity:0;transition:opacity .18s;
}
.preset-btn:hover .preset-lbl{opacity:1}

/* Blob list */
.blob-list{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.55rem}
.blob-item{
  display:flex;align-items:center;gap:.55rem;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:.45rem .6rem;
  cursor:pointer;transition:border-color .18s;
}
.blob-item:hover{border-color:var(--border2)}
.blob-item.sel{border-color:var(--accent)}

.swatch-btn{
  width:28px;height:28px;border-radius:7px;
  border:none;padding:0;cursor:pointer;flex-shrink:0;
  position:relative;overflow:hidden;
}
.swatch-btn input[type=color]{
  position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);
  opacity:0;cursor:pointer;border:none;padding:0;
}
.blob-info{flex:1;min-width:0}
.blob-name{font-size:.78rem;font-weight:500}
.blob-hex{font-size:.68rem;color:var(--muted);font-family:monospace}
.blob-del{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:.22rem;border-radius:5px;font-size:.95rem;line-height:1;
  transition:color .18s,background .18s;flex-shrink:0;
}
.blob-del:hover{color:#f87171;background:rgba(248,113,113,.1)}

.add-btn{
  width:100%;padding:.55rem;
  background:transparent;border:1.5px dashed var(--border);
  border-radius:10px;color:var(--muted);cursor:pointer;
  font-size:.78rem;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:.35rem;
  transition:all .18s;
}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--glow)}

/* Toggles */
.tog-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:.3rem 0;
}
.tog-label{font-size:.83rem}
.tog{position:relative;width:40px;height:22px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-track{
  position:absolute;inset:0;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:22px;cursor:pointer;transition:.24s;
}
.tog-track::after{
  content:'';position:absolute;
  width:15px;height:15px;top:2.5px;left:2.5px;
  background:var(--muted);border-radius:50%;transition:.24s;
}
.tog input:checked~.tog-track{background:var(--accent);border-color:var(--accent)}
.tog input:checked~.tog-track::after{transform:translateX(18px);background:#fff}

/* Sliders */
.slider-sec{padding-top:.45rem}
.sl-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.45rem}
.sl-label{font-size:.78rem;color:var(--muted)}
.sl-val{font-size:.78rem;font-weight:700;color:var(--text)}
input[type=range]{
  -webkit-appearance:none;width:100%;height:4px;
  border-radius:4px;background:var(--surface2);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px var(--glow);cursor:pointer;
}

/* Buttons */
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.btn{
  display:flex;align-items:center;justify-content:center;gap:.38rem;
  padding:.62rem .8rem;border-radius:10px;border:none;
  font-size:.78rem;font-weight:700;cursor:pointer;
  transition:all .18s;white-space:nowrap;
}
.btn-full{grid-column:1/-1}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 4px 16px var(--glow);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--glow)}
.btn-primary:active{transform:translateY(0)}
.btn-sec{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);
}
.btn-sec:hover{border-color:var(--accent);color:var(--accent);background:var(--glow)}

/* Modal */
.modal-ov{
  position:fixed;inset:0;
  background:rgba(0,0,0,.78);backdrop-filter:blur(14px);
  z-index:1000;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .24s;
}
.modal-ov.open{opacity:1;pointer-events:all}
.modal{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:20px;padding:1.4rem;
  width:min(560px,92vw);
  transform:translateY(22px) scale(.98);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 36px 80px rgba(0,0,0,.65);
}
.modal-ov.open .modal{transform:translateY(0) scale(1)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.modal-ttl{font-size:.95rem;font-weight:700}
.modal-x{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--muted);width:28px;height:28px;border-radius:8px;
  cursor:pointer;font-size:.85rem;
  display:flex;align-items:center;justify-content:center;transition:all .18s;
}
.modal-x:hover{color:var(--text);border-color:var(--border2)}
.code-blk{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:.9rem;
  font-family:'Fira Code','Cascadia Code','JetBrains Mono',monospace;
  font-size:.7rem;line-height:1.65;color:#93c5fd;
  overflow-x:auto;white-space:pre;max-height:280px;overflow-y:auto;
}
.copy-css-btn{
  width:100%;margin-top:.8rem;padding:.72rem;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:10px;
  font-size:.85rem;font-weight:700;cursor:pointer;
  transition:all .18s;letter-spacing:.02em;
}
.copy-css-btn:hover{opacity:.88;transform:translateY(-1px)}
.copy-css-btn.copied{background:linear-gradient(135deg,#10b981,#059669)}

/* Toast */
.toast{
  position:fixed;bottom:1.4rem;left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--surface);border:1px solid var(--border2);
  border-radius:100px;padding:.55rem 1.2rem;
  font-size:.78rem;font-weight:500;
  z-index:2000;box-shadow:0 8px 32px rgba(0,0,0,.55);
  transition:transform .32s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Footer */
footer{
  display:flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.65rem;border-top:1px solid var(--border);
  font-size:.7rem;color:var(--muted);flex-shrink:0;
}
footer a{color:var(--muted);text-decoration:none;transition:color .18s}
footer a:hover{color:var(--text)}

/* Mobile */
@media(max-width:720px){
  body{overflow:auto}
  main{flex-direction:column;overflow:visible}
  .canvas-area{padding:.75rem}
  .canvas-wrap{aspect-ratio:16/9;flex:none;height:auto}
  .panel{width:100%;border-left:none;border-top:1px solid var(--border)}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-gem"></div>
    <span class="logo-name">Mesh Gradient Studio</span>
    <span class="badge">Free</span>
  </div>
  <div class="hdr-right">

    <div class="card">

        </button>
        <button class="btn btn-sec" id="dlBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>

        <button class="btn btn-sec btn-full" id="rndBtn">

          Randomize
        </button>
      </div>
    </div>
  </div>
</main>

<!-- CSS Modal -->
<div class="modal-ov" id="cssModal">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-ttl">CSS Code</span>
      <button class="modal-x" id="closeModal">✕</button>

    <pre class="code-blk" id="cssCode"></pre>
    <button class="copy-css-btn" id="copyCssBtn">Copy to Clipboard</button>

</div>

<div class="toast" id="toast"></div>

<footer>
  <span>Mesh Gradient Studio</span>
  <span>·</span>

  <span>Free forever</span>
</footer>

const RENDER_SCALE = 4;   // render at 1/RENDER_SCALE resolution

// --- State ---
let blobs       = [];

let dragging    = false;

// --- DOM ---
const cw         = document.getElementById('cw');

const ctx        = gc.getContext('2d');

// Offscreen canvas (1/RENDER_SCALE resolution)
const off = document.createElement('canvas');
const offCtx = off.getContext('2d', { willReadFrequently: true });

// Grain tile
const gt    = document.createElement('canvas');

// --- Presets ---

    blobs:[

      {x:.72,y:.52,c:'#9b59b6'},

  },
  {

    bg:'linear-gradient(135deg,#ffeaa7,#f9ca24,#f0932b)',
    blobs:[
      {x:.22,y:.32,c:'#ffeaa7'},
      {x:.78,y:.62,c:'#f9ca24'},
      {x:.52,y:.88,c:'#f0932b'},
      {x:.12,y:.72,c:'#c0392b'},
    ]
  },
];

// --- Blob helpers ---
function mkBlob(x, y, color) {
  return {
    id: blobId++, x, y, bx: x, by: y,
    color: color || rndColor(),
    px: Math.random() * Math.PI * 2,
    py: Math.random() * Math.PI * 2,
    amp: .06 + Math.random() * .06,
  };
}

function rndColor() {
  const h = Math.random() * 360;
  const s = 65 + Math.random() * 35;
  const l = 45 + Math.random() * 22;
  return hsl2hex(h, s, l);
}

function hsl2hex(h, s, l) {
  l /= 100; s /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    return Math.round(255 * (l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1))).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

function hex2rgb(hex) {
  const v = parseInt(hex.replace('#',''), 16);
  return [(v>>16)&255, (v>>8)&255, v&255];
}

// --- Rendering ---
function render(ts) {
  const W = gc.width, H = gc.height;
  const RW = Math.ceil(W / RENDER_SCALE);
  const RH = Math.ceil(H / RENDER_SCALE);

  if (off.width !== RW)  off.width  = RW;
  if (off.height !== RH) off.height = RH;

  const id   = offCtx.createImageData(RW, RH);
  const data = id.data;

  // Compute positions (with optional animation)
  const bd = blobs.map(b => {
    let bx = b.bx, by = b.by;
    if (animated && ts !== undefined) {
      const t = ts * .001 * (animSpd / 50);
      bx += Math.sin(t + b.px) * b.amp;
      by += Math.cos(t + b.py) * b.amp;
      bx = Math.max(.01, Math.min(.99, bx));
      by = Math.max(.01, Math.min(.99, by));
    }
    return { x: bx * RW, y: by * RH, rgb: hex2rgb(b.color) };
  });

  if (!bd.length) {
    ctx.fillStyle = '#10101a';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  for (let py = 0; py < RH; py++) {
    for (let px = 0; px < RW; px++) {
      let r=0, g=0, b=0, tw=0;
      for (const p of bd) {
        const dx = px - p.x, dy = py - p.y;
        const w = 1 / Math.pow(dx*dx + dy*dy + .001, IDW_POWER * .5);
        tw += w;
        r  += w * p.rgb[0];
        g  += w * p.rgb[1];
        b  += w * p.rgb[2];
      }
      const i = (py * RW + px) * 4;
      data[i]   = r  / tw;
      data[i+1] = g  / tw;
      data[i+2] = b  / tw;
      data[i+3] = 255;
    }
  }

  offCtx.putImageData(id, 0, 0);
  ctx.imageSmoothingEnabled  = true;
  ctx.imageSmoothingQuality  = 'high';
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(off, 0, 0, W, H);
}

// --- Grain ---
function mkGrain() {
  const id = gtCtx.createImageData(GRAIN_TILE, GRAIN_TILE);
  const d  = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255 | 0;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  gtCtx.putImageData(id, 0, 0);
}

function drawGrain() {
  if (!grainOn) { grc.style.opacity = '0'; return; }
  mkGrain();
  grCtx.clearRect(0, 0, grc.width, grc.height);
  for (let y = 0; y < grc.height; y += GRAIN_TILE)
    for (let x = 0; x < grc.width; x += GRAIN_TILE)
      grCtx.drawImage(gt, x, y);
  grc.style.opacity = String(grainAmt / 200);
}

// --- Loop ---
function tick(ts) {
  frameN++;
  render(ts);
  if (grainOn && frameN % 4 === 0) drawGrain();
  rafId = requestAnimationFrame(tick);
}

function startLoop() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}

function stopLoop() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  render(); drawGrain();
}

function loopNeeded() { return animated || grainOn; }

// --- Canvas setup ---
function setupCanvas() {
  const rect = cw.getBoundingClientRect();
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.round(rect.width  * dpr);
  const H = Math.round(rect.height * dpr);
  if (gc.width !== W || gc.height !== H) {
    gc.width  = W; gc.height  = H;
    grc.width = W; grc.height = H;
  }
  render(); drawGrain(); updateHandles();
}

// --- Handles ---
function updateHandles() {
  document.querySelectorAll('.blob-handle').forEach(el => el.remove());
  const rect = cw.getBoundingClientRect();
  blobs.forEach(b => {
    const el = document.createElement('div');
    el.className = 'blob-handle' + (b.id === selId ? ' sel' : '');
    el.dataset.id = b.id;
    el.style.left  = (b.bx * rect.width)  + 'px';
    el.style.top   = (b.by * rect.height) + 'px';
    el.style.background = b.color;
    cw.appendChild(el);
  });
}

function moveHandle(id, bx, by) {
  const el = cw.querySelector(`.blob-handle[data-id="${id}"]`);
  if (!el) return;
  const rect = cw.getBoundingClientRect();
  el.style.left = (bx * rect.width)  + 'px';
  el.style.top  = (by * rect.height) + 'px';
}

// --- Drag ---
cw.addEventListener('mousedown', e => {
  if (e.target.classList.contains('blob-handle')) {
    dragging = true;
    dragId   = Number(e.target.dataset.id);
    selId    = dragId;
    e.target.classList.add('dragging');
    e.preventDefault();
    return;
  }
  if (e.target === gc || e.target === grc) {
    const r = cw.getBoundingClientRect();
    const b = mkBlob(
      (e.clientX - r.left) / r.width,
      (e.clientY - r.top)  / r.height
    );
    blobs.push(b);
    selId = b.id;
    updateBlobList(); updateHandles();
    if (!loopNeeded()) render();
  }
});

document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const r = cw.getBoundingClientRect();
  const bx = Math.max(.01, Math.min(.99, (e.clientX - r.left) / r.width));
  const by = Math.max(.01, Math.min(.99, (e.clientY - r.top)  / r.height));
  const blob = blobs.find(b => b.id === dragId);
  if (blob) {
    blob.bx = bx; blob.by = by;
    moveHandle(dragId, bx, by);
    if (!loopNeeded()) render();
  }
});

document.addEventListener('mouseup', () => {
  if (!dragging) return;
  cw.querySelectorAll('.blob-handle').forEach(el => el.classList.remove('dragging'));
  dragging = false; dragId = null;
});

// Touch
cw.addEventListener('touchstart', e => {
  if (e.target.classList.contains('blob-handle')) {
    dragging = true;
    dragId   = Number(e.target.dataset.id);
    selId    = dragId;
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (!dragging) return;
  e.preventDefault();
  const t = e.touches[0];
  const r = cw.getBoundingClientRect();
  const bx = Math.max(.01, Math.min(.99, (t.clientX - r.left) / r.width));
  const by = Math.max(.01, Math.min(.99, (t.clientY - r.top)  / r.height));
  const blob = blobs.find(b => b.id === dragId);
  if (blob) {
    blob.bx = bx; blob.by = by;
    moveHandle(dragId, bx, by);
    if (!loopNeeded()) render();
  }
}, { passive: false });

document.addEventListener('touchend', () => { dragging = false; dragId = null; });

// --- Blob list ---
function updateBlobList() {
  blobListEl.innerHTML = '';
  blobs.forEach((b, i) => {
    const item = document.createElement('div');
    item.className = 'blob-item' + (b.id === selId ? ' sel' : '');
    item.dataset.id = b.id;

    const sw = document.createElement('div');
    sw.className = 'swatch-btn';
    sw.style.background = b.color;
    const ci = document.createElement('input');
    ci.type = 'color'; ci.value = b.color;
    ci.addEventListener('input', e => {
      b.color = e.target.value;
      sw.style.background = b.color;
      const hEl = item.querySelector('.blob-hex');
      if (hEl) hEl.textContent = b.color.toUpperCase();
      const hnd = cw.querySelector(`.blob-handle[data-id="${b.id}"]`);
      if (hnd) hnd.style.background = b.color;
      if (!loopNeeded()) render();
    });
    sw.appendChild(ci);

    const inf = document.createElement('div');
    inf.className = 'blob-info';
    inf.innerHTML = `<div class="blob-name">Point ${i+1}</div><div class="blob-hex">${b.color.toUpperCase()}</div>`;

    const del = document.createElement('button');
    del.className = 'blob-del'; del.textContent = '×'; del.title = 'Remove';
    del.addEventListener('click', e => {
      e.stopPropagation();
      blobs = blobs.filter(x => x.id !== b.id);
      if (selId === b.id) selId = null;
      updateBlobList(); updateHandles();
      if (!loopNeeded()) render();
    });

    item.addEventListener('click', () => {
      selId = b.id;
      updateBlobList(); updateHandles();
      ci.click();
    });

    item.append(sw, inf, del);
    blobListEl.appendChild(item);
  });
}

// --- Presets ---
function loadPreset(preset, idx) {
  blobs = preset.blobs.map(b => mkBlob(b.x, b.y, b.c));
  selId = null;
  document.querySelectorAll('.preset-btn').forEach((el, i) => el.classList.toggle('active', i === idx));
  updateBlobList(); updateHandles();
  if (!loopNeeded()) render();
}

function buildPresets() {
  PRESETS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn' + (i === 0 ? ' active' : '');
    btn.style.background = p.bg;
    btn.title = p.name;
    btn.innerHTML = `<div class="preset-lbl">${p.name}</div>`;
    btn.addEventListener('click', () => loadPreset(p, i));
    presetsEl.appendChild(btn);
  });
}

// --- Controls ---
document.getElementById('animTog').addEventListener('change', e => {
  animated = e.target.checked;
  document.getElementById('speedSec').style.display = animated ? 'block' : 'none';
  if (loopNeeded()) startLoop(); else stopLoop();
});

document.getElementById('speedSl').addEventListener('input', e => {
  animSpd = +e.target.value;
  document.getElementById('speedLbl').textContent = animSpd;
});

document.getElementById('grainTog').addEventListener('change', e => {
  grainOn = e.target.checked;
  document.getElementById('grainSec').style.display = grainOn ? 'block' : 'none';
  if (loopNeeded()) startLoop(); else stopLoop();
  if (!grainOn) { grc.style.opacity = '0'; }
});

document.getElementById('grainSl').addEventListener('input', e => {
  grainAmt = +e.target.value;
  document.getElementById('grainLbl').textContent = grainAmt;
  if (grainOn) grc.style.opacity = String(grainAmt / 200);
});

document.getElementById('addBtn').addEventListener('click', () => {
  const b = mkBlob(.2 + Math.random() * .6, .2 + Math.random() * .6);
  blobs.push(b); selId = b.id;
  updateBlobList(); updateHandles();
  if (!loopNeeded()) render();
});

// --- CSS export ---
function makeCSS() {
  if (!blobs.length) return `.gradient {\n  background: #10101a;\n}`;
  const stops = blobs.map(b =>
    `  radial-gradient(\n    ellipse at ${Math.round(b.bx*100)}% ${Math.round(b.by*100)}%,\n    ${b.color} 0%,\n    transparent 65%\n  )`
  ).join(',\n');
  return `.gradient {\n  background:\n${stops},\n  #10101a;\n}`;
}

document.getElementById('cssBtnOpen').addEventListener('click', () => {
  cssCodeEl.textContent = makeCSS();
  cssModal.classList.add('open');
});
document.getElementById('closeModal').addEventListener('click', () => cssModal.classList.remove('open'));
cssModal.addEventListener('click', e => { if (e.target === cssModal) cssModal.classList.remove('open'); });

copyCssBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(cssCodeEl.textContent);
    copyCssBtn.textContent = '✓ Copied!';
    copyCssBtn.classList.add('copied');
    setTimeout(() => { copyCssBtn.textContent = 'Copy to Clipboard'; copyCssBtn.classList.remove('copied'); }, 2200);
  } catch { showToast('Please copy the code manually'); }
});

// --- PNG download ---
document.getElementById('dlBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'mesh-gradient.png';
  a.href = gc.toDataURL('image/png');
  a.click();
  showToast('PNG saved!');
});

// --- Randomize ---
document.getElementById('rndBtn').addEventListener('click', () => {
  blobs.forEach(b => {
    b.color = rndColor();
    b.bx = .1 + Math.random() * .8;
    b.by = .1 + Math.random() * .8;
    b.px = Math.random() * Math.PI * 2;
    b.py = Math.random() * Math.PI * 2;
  });
  document.querySelectorAll('.preset-btn').forEach(el => el.classList.remove('active'));
  updateBlobList(); updateHandles();
  if (!loopNeeded()) render();
  showToast('Randomized!');
});

// --- Share X ---
document.getElementById('xShareBtn').addEventListener('click', e => {
  e.preventDefault();
  const text = encodeURIComponent('This free mesh gradient generator is insane 🔥\n\nCreate stunning animated gradients and export CSS instantly — no signup needed.\n\n');
  const url  = encodeURIComponent(window.location.href);
  window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'noopener');
});

// --- Toast ---
let toastTmr;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => toast.classList.remove('show'), 2400);
}

// --- Resize ---
new ResizeObserver(setupCanvas).observe(cw);

// --- Init ---
buildPresets();
loadPreset(PRESETS[0], 0);
setTimeout(setupCanvas, 40);
</script>
</body>
</html>
