<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RISO PRESS — Risograph Print Simulator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F5F0E8'/><circle cx='16' cy='16' r='8' stroke='%231a1a1a' stroke-width='1.4' fill='none'/><line x1='16' y1='4' x2='16' y2='28' stroke='%231a1a1a' stroke-width='1'/><line x1='4' y1='16' x2='28' y2='16' stroke='%231a1a1a' stroke-width='1'/><circle cx='22' cy='22' r='5' fill='%23FF48B0' opacity='.82'/><circle cx='10' cy='22' r='5' fill='%230078BF' opacity='.82'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=New+Tegomin&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:      #F5F0E8;
      --paper-dark: #EDE8DB;
      --ink:        #1a1a1a;
      --ink-mid:    #555;
      --ink-light:  #999;
      --border:     #D5CEC2;
      --font:         'DM Mono', 'Courier New', monospace;
      --font-display: 'Syne', system-ui, sans-serif;
      --font-jp:      'New Tegomin', serif;
    }

    body {
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding: 16px 24px;
    }

    /* ── HEADER ────────────────────────────────── */
    header {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--ink);
    }
    .logo {
      font-family: var(--font-display); font-size: 28px; font-weight: 800;
      letter-spacing: -0.5px; display: flex; align-items: center; gap: 9px;
    }
    .logo-reg {
      width: 15px; height: 15px; opacity: 0.28; flex-shrink: 0;
    }
    .tagline {
      font-family: var(--font); font-size: 10px; color: var(--ink-light);
      letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
    }
    .process-tag {
      font-family: var(--font); font-size: 9px; color: var(--border);
      letter-spacing: 0.08em; font-weight: 400; margin-left: auto;
      white-space: nowrap;
    }
    @media (max-width: 720px) { .process-tag { display: none; } }
